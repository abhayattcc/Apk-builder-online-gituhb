<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #ccc;
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #ff416c;
    }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255,65,108,0.3);
    }
    .note {
      margin-top: 28px;
      padding: 16px;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #bbb;
    }
    .note strong { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>YouTube Downloader</h1>
    <p class="subtitle">Powered by yt-dlp + GitHub Actions</p>

    <label>YouTube Link</label>
    <input type="url" id="url" placeholder="https://youtu.be/..." />

    <label>Quality</label>
    <select id="quality">
      <option value="best">Best Quality</option>
      <option value="1080p">1080p</option>
      <option value="720p">720p</option>
      <option value="480p">480p</option>
      <option value="mp3">Audio (MP3)</option>
      <option value="m4a">Audio (M4A)</option>
    </select>

    <button onclick="startDownload()">Download Video</button>

    <div class="note">
      <strong>How it works:</strong><br>
      1. Paste the link and choose quality<br>
      2. Click the button → Actions page will open<br>
      3. Click <b>Run workflow</b> (URL is already filled)<br>
      4. Wait 2–4 minutes<br>
      5. Refresh this page → your video will appear below for download
    </div>
  </div>

  <script>
    // ========== CHANGE THIS ==========
    const GITHUB_USER = "abhayattcc";
    const GITHUB_REPO = "Apk-builder-online-gituhb";
    // =================================

    function startDownload() {
      const url = document.getElementById("url").value.trim();
      const quality = document.getElementById("quality").value;

      if (!url) {
        alert("Please paste a YouTube link");
        return;
      }

      // Open the workflow page
      const actionsUrl = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows/download.yml`;
      
      // Show instructions
      alert(
        "Next steps:\n\n" +
        "1. Click \"Run workflow\" on the next page\n" +
        "2. Paste this URL: " + url + "\n" +
        "3. Select quality: " + quality + "\n" +
        "4. Click the green Run workflow button\n\n" +
        "After it finishes, refresh this page to download the file."
      );

      window.open(actionsUrl, "_blank");
    }
  </script>
</body>
</html>
