<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Downloader</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #eee;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      background: linear-gradient(90deg, #ff2d55, #ff9500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: #1c1c24;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #2a2a35;
      margin: 30px 0;
    }
    input, select, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #121218;
      color: white;
      font-size: 16px;
    }
    button {
      background: linear-gradient(90deg, #ff2d55, #ff9500);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .info {
      font-size: 14px;
      color: #aaa;
      line-height: 1.5;
      margin-top: 20px;
    }
    .file {
      display: flex;
      justify-content: space-between;
      background: #1c1c24;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 8px 0;
      border: 1px solid #2a2a35;
    }
    .file a { color: #ff9500; text-decoration: none; }
  </style>
</head>
<body>
  <h1>YouTube Downloader</h1>
  <p style="text-align:center;color:#888">Paste link → Download</p>

  <div class="card">
    <label>YouTube URL</label>
    <input type="url" id="url" placeholder="https://youtu.be/..." />

    <label>Quality</label>
    <select id="quality">
      <option value="best">Best</option>
      <option value="1080p">1080p</option>
      <option value="720p">720p</option>
      <option value="480p">480p</option>
      <option value="mp3">MP3</option>
      <option value="m4a">M4A</option>
    </select>

    <button onclick="start()">Download Video</button>

    <div class="info">
      <b>Steps:</b><br>
      1. Paste YouTube link<br>
      2. Click Download<br>
      3. On the next page click green <b>Run workflow</b><br>
      4. Wait 2–5 minutes<br>
      5. Refresh this page → video will appear below
    </div>
  </div>

  <h3>Downloaded Files</h3>
  <div id="list">Loading...</div>

  <script>
    // ====== CHANGE THESE ======
    const USER = "abhayattcc";
    const REPO = "Apk-builder-online-gituhb";
    // ==========================

    function start() {
      const url = document.getElementById("url").value.trim();
      const quality = document.getElementById("quality").value;
      if (!url) return alert("Please enter a YouTube URL");

      const actions = `https://github.com/${USER}/${REPO}/actions/workflows/download-video.yml`;
      alert("Next:\n1. Click \"Run workflow\"\n2. Paste the URL\n3. Choose quality: " + quality);
      window.open(actions, "_blank");
    }

    async function loadFiles() {
      const el = document.getElementById("list");
      try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/downloads`);
        if (!res.ok) {
          el.innerHTML = "<p style='color:#666'>No videos yet</p>";
          return;
        }
        const files = await res.json();
        el.innerHTML = files
          .filter(f => f.type === "file")
          .map(f => `
            <div class="file">
              <span>${f.name}</span>
              <a href="${f.download_url}" download>Download</a>
            </div>
          `).join("") || "<p style='color:#666'>No videos yet</p>";
      } catch {
        el.innerHTML = "<p style='color:#666'>No videos yet</p>";
      }
    }
    loadFiles();
  </script>
</body>
</html>
