name: Create Project and Build Video Editor APK

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Re-create project files even if they already exist (overwrites edits)"
        type: boolean
        default: false
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files in repo root
        env:
          REGEN: ${{ inputs.regenerate }}
        run: |
          test -f create-video-editor.sh || { echo "Upload create-video-editor.sh to the repo root"; exit 1; }
          HASH=$(sha256sum create-video-editor.sh | cut -d' ' -f1)
          # Skip only if project exists, was made from this exact script, and no forced regenerate
          if [ -f app/build.gradle ] && [ -f .project-source-hash ] \
             && [ "$(cat .project-source-hash)" = "$HASH" ] && [ "$REGEN" != "true" ]; then
            echo "Project files already up to date - skipping creation"
            exit 0
          fi

          # Keep only the file-generation part of the script (no git/gh, no push)
          sed -e '/^command -v git /d' \
              -e '/^command -v gh /d' \
              -e '/^gh auth status/d' \
              -e '/^git init -q -b main/,$d' \
              create-video-editor.sh > "$RUNNER_TEMP/generate.sh"

          if [ -f .gitignore ]; then cp .gitignore "$RUNNER_TEMP/gitignore.old"; fi

          # "." = generate straight into the repo root
          bash "$RUNNER_TEMP/generate.sh" .

          # The script makes its own build.yml; this workflow replaces it
          rm -f .github/workflows/build.yml
          echo "$HASH" > .project-source-hash
          if [ -f "$RUNNER_TEMP/gitignore.old" ]; then cat "$RUNNER_TEMP/gitignore.old" >> .gitignore; fi

          find . -path ./.git -prune -o -type f -print | sort

      - name: Fix Media3 1.5.1 import (VideoCompositorSettings moved to effect package)
        run: |
          find . -name MainActivity.java -path '*videoeditor*' -not -path './.git/*' \
            -exec sed -i 's/import androidx\.media3\.common\.VideoCompositorSettings;/import androidx.media3.effect.VideoCompositorSettings;/' {} +
          grep -rn "VideoCompositorSettings;" --include=MainActivity.java . || true

      - name: Commit project files to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add video editor project files"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors (only if build failed)
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -n -E "error:|What went wrong|Execution failed|Could not|FAILURE" -A4 build.log | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoEditor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-apk
          path: VideoEditor.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Editor build ${{ github.run_number }}
          files: VideoEditor.apk
