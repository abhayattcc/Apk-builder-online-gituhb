name: Create and Build Video Editor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - create-video-editor.sh
      - .github/workflows/build-video-editor.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project folders and files from script
        run: |
          test -f create-video-editor.sh || { echo "Upload create-video-editor.sh to the repo root"; exit 1; }
          # Keep only the file-generation part (drop git/gh checks and the push/watch part)
          sed -e '/^command -v git /d' \
              -e '/^command -v gh /d' \
              -e '/^gh auth status/d' \
              -e '/^git init -q -b main/,$d' \
              create-video-editor.sh > "$RUNNER_TEMP/generate.sh"
          bash "$RUNNER_TEMP/generate.sh" video-editor-app
          find video-editor-app -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: video-editor-app

      - name: Build debug APK
        working-directory: video-editor-app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors (only if build failed)
        if: failure()
        working-directory: video-editor-app
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -n -E "error:|warning: \[|What went wrong|Execution failed|Could not|FAILURE" -A4 build.log | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        working-directory: video-editor-app
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoEditor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-apk
          path: video-editor-app/VideoEditor.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Editor build ${{ github.run_number }}
          files: video-editor-app/VideoEditor.apk
