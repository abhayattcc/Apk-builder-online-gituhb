name: Download Telegram Media

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: "Telegram post link (example: https://t.me/odiamahabharat/154)"
        required: true
        type: string
        default: "https://t.me/odiamahabharat/154"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Download media from Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_LINK: ${{ inputs.telegram_link }}
        run: |
          echo "Starting download for: ${{ inputs.telegram_link }}"
          python telegram_downloader.py "${{ inputs.telegram_link }}"

      - name: Upload downloaded file as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-media
          path: |
            downloads/
            downloaded_file.txt
          retention-days: 5
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### Download Result" >> $GITHUB_STEP_SUMMARY
          echo "- Link: \`${{ inputs.telegram_link }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f downloaded_file.txt ]; then
            echo "- File: \`$(cat downloaded_file.txt)\`" >> $GITHUB_STEP_SUMMARY
            echo "- Status: ✅ Success – download the artifact from the run page" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: ❌ Failed or no media found" >> $GITHUB_STEP_SUMMARY
          fi
