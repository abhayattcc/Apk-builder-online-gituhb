name: Build APK and Deploy Download Page

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: master

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-downloader-apk
          path: ${{ steps.buildozer.outputs.filename }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          files: ${{ steps.buildozer.outputs.filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-page:
    needs: build-apk
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate Landing Page
        run: |
          mkdir -p public
          REPO_NAME="${{ github.repository }}"
          LATEST_RELEASE_URL="https://github.com/${REPO_NAME}/releases/latest"

          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>TG Video Downloader APK</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
                  .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 420px; width: 100%; border: 1px solid #334155; }
                  .badge { display: inline-block; background: #0284c7; color: white; padding: 4px 12px; border-radius: 9999px; font-size: 0.8rem; font-weight: bold; margin-bottom: 15px; }
                  h1 { font-size: 1.8rem; margin-bottom: 10px; color: #ffffff; }
                  p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }
                  .btn { display: inline-block; width: 100%; background: #22c55e; color: white; text-decoration: none; padding: 14px 20px; border-radius: 8px; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
                  .btn:hover { background: #16a34a; }
                  .footer { margin-top: 20px; font-size: 0.8rem; color: #64748b; }
              </style>
          </head>
          <body>
              <div class="card">
                  <div class="badge">Pure Python Android APK</div>
                  <h1>TG Video Downloader</h1>
                  <p>Download Telegram public channel videos directly to your Android device storage.</p>
                  <a class="btn" href="LATEST_URL_PLACEHOLDER">⬇️ Download Latest APK</a>
                  <div class="footer">Built & Deployed automatically via GitHub Actions</div>
              </div>
          </body>
          </html>
          EOF

          # Replace placeholder with dynamic release URL
          sed -i "s|LATEST_URL_PLACEHOLDER|${LATEST_RELEASE_URL}|g" public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
