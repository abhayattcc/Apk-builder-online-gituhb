name: Download & Deploy to Pages

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube / any yt-dlp supported URL"
        required: true
        type: string
      format:
        description: "Format"
        required: true
        default: "best"
        type: choice
        options:
          - best
          - 1080p
          - 720p
          - 480p
          - audio-mp3
          - audio-m4a

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup yt-dlp + FFmpeg
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Download video
        run: |
          mkdir -p downloads
          
          URL="${{ github.event.inputs.url }}"
          FORMAT="${{ github.event.inputs.format }}"

          case $FORMAT in
            "best")
              yt-dlp -f "bv*+ba/b" --merge-output-format mp4 \
                -o "downloads/%(title).200B [%(id)s].%(ext)s" "$URL"
              ;;
            "1080p")
              yt-dlp -f "bv*[height<=1080]+ba/b" --merge-output-format mp4 \
                -o "downloads/%(title).200B [%(id)s].%(ext)s" "$URL"
              ;;
            "720p")
              yt-dlp -f "bv*[height<=720]+ba/b" --merge-output-format mp4 \
                -o "downloads/%(title).200B [%(id)s].%(ext)s" "$URL"
              ;;
            "480p")
              yt-dlp -f "bv*[height<=480]+ba/b" --merge-output-format mp4 \
                -o "downloads/%(title).200B [%(id)s].%(ext)s" "$URL"
              ;;
            "audio-mp3")
              yt-dlp -x --audio-format mp3 \
                -o "downloads/%(title).200B [%(id)s].%(ext)s" "$URL"
              ;;
            "audio-m4a")
              yt-dlp -x --audio-format m4a \
                -o "downloads/%(title).200B [%(id)s].%(ext)s" "$URL"
              ;;
          esac

          echo "=== Downloaded files ==="
          ls -lh downloads/

      - name: Commit & Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add downloads/
          git commit -m "Download: ${{ github.event.inputs.url }}" || echo "No changes"
          git push

  deploy:
    needs: download
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './downloads'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4