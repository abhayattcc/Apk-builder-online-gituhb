name: Build APK from User Voice

on:
  push:
    paths:
      - 'voice.wav'
      - 'text.txt'
      - 'language.txt'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 1. Check user files exist
      # -------------------------------------------------
      - name: Check required files
        run: |
          echo "===== Checking user files ====="
          if [ ! -f voice.wav ]; then
            echo "ERROR: voice.wav not found in repo root"
            exit 1
          fi
          if [ ! -f text.txt ]; then
            echo "ERROR: text.txt not found in repo root"
            exit 1
          fi
          if [ ! -f language.txt ]; then
            echo "ERROR: language.txt not found in repo root"
            exit 1
          fi

          echo "voice.wav  → $(ls -lh voice.wav)"
          echo "text.txt   → $(cat text.txt)"
          echo "language   → $(cat language.txt)"

      # -------------------------------------------------
      # 2. Read language
      # -------------------------------------------------
      - name: Read language
        id: lang
        run: |
          LANG=$(cat language.txt | tr '[:upper:]' '[:lower:]' | xargs)
          echo "Selected language: $LANG"

          case $LANG in
            english|en) echo "lang=english" >> $GITHUB_OUTPUT ;;
            hindi|hi)   echo "lang=hindi"   >> $GITHUB_OUTPUT ;;
            odia|or|oriya) echo "lang=odia" >> $GITHUB_OUTPUT ;;
            *)
              echo "Unknown language '$LANG'. Using english."
              echo "lang=english" >> $GITHUB_OUTPUT
              ;;
          esac

      # -------------------------------------------------
      # 3. Install tools
      # -------------------------------------------------
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget tar bzip2 ffmpeg sox

      # -------------------------------------------------
      # 4. Prepare user voice (convert to 24kHz mono)
      # -------------------------------------------------
      - name: Prepare voice
        run: |
          mkdir -p work/voices
          ffmpeg -y -i voice.wav -ac 1 -ar 24000 -sample_fmt s16 work/voices/reference.wav
          cp text.txt work/voices/reference.txt
          cp language.txt work/voices/language.txt

          echo "Prepared reference audio:"
          ls -lh work/voices/
          cat work/voices/reference.txt

      # -------------------------------------------------
      # 5. Download ZipVoice model
      # -------------------------------------------------
      - name: Download ZipVoice model
        run: |
          mkdir -p work/model
          cd work/model

          wget -q --show-progress \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia.tar.bz2

          tar xf sherpa-onnx-zipvoice-distill-int8-zh-en-emilia.tar.bz2
          rm -f sherpa-onnx-zipvoice-distill-int8-zh-en-emilia.tar.bz2

          if [ -d sherpa-onnx-zipvoice-distill-int8-zh-en-emilia ]; then
            mv sherpa-onnx-zipvoice-distill-int8-zh-en-emilia/* .
            rmdir sherpa-onnx-zipvoice-distill-int8-zh-en-emilia || true
          fi

          wget -q --show-progress \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos_24khz.onnx

          echo "Model ready:"
          ls -lh

      # -------------------------------------------------
      # 6. Put everything into Android assets
      # -------------------------------------------------
      - name: Prepare Android assets
        run: |
          mkdir -p app/src/main/assets/zipvoice
          mkdir -p app/src/main/assets/voices

          # Copy model
          cp -r work/model/* app/src/main/assets/zipvoice/

          # Copy user voice + text + language
          cp work/voices/reference.wav app/src/main/assets/voices/voice.wav
          cp work/voices/reference.txt app/src/main/assets/voices/text.txt
          cp work/voices/language.txt  app/src/main/assets/voices/language.txt

          echo "Assets prepared:"
          find app/src/main/assets -type f | sort

      # -------------------------------------------------
      # 7. Setup Java + Android SDK
      # -------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------
      # 8. Build APK
      # -------------------------------------------------
      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "=============================================="
            echo "No Android project (gradlew) found in this repo."
            echo "Packaging model + user voice as asset bundle."
            echo "=============================================="
            mkdir -p output
            tar -czf output/zipvoice-user-voice-assets.tar.gz -C app/src/main/assets .
            echo "Language: $(cat language.txt)" > output/info.txt
            echo "Reference text:" >> output/info.txt
            cat text.txt >> output/info.txt
          fi

      # -------------------------------------------------
      # 9. Upload result
      # -------------------------------------------------
      - name: Upload APK or assets
        uses: actions/upload-artifact@v4
        with:
          name: ZipVoice-APK-${{ steps.lang.outputs.lang }}
          path: |
            app/build/outputs/apk/release/*.apk
            output/**
          if-no-files-found: warn
          retention-days: 30
