name: Build picture assets

on:
  workflow_dispatch:        # Actions tab -> "Build picture assets" -> Run workflow

permissions:
  contents: write           # needed to attach assets.zip to a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pillow
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Restore previous result (only unfinished words are downloaded again)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --pattern assets.zip --dir . || echo "no previous release - full build"

      - name: Download all chapters and build assets
        run: python -u make_assets.py

      - name: Show result
        run: |
          ls -lh assets.zip
          head -5 report.csv

      - name: Upload assets.zip (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            assets.zip
            report.csv
          retention-days: 30

      - name: Publish assets.zip as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="assets-${{ github.run_number }}"
          gh release create "$TAG" assets.zip report.csv \
            --title "Assets build ${{ github.run_number }}" \
            --notes "Generated by workflow run ${{ github.run_id }}"
