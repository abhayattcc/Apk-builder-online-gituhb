name: Build picture assets

on:
  workflow_dispatch:        # Actions tab -> "Build picture assets" -> Run workflow

permissions:
  contents: write           # needed to attach assets.zip to a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow

      - name: Download and verify all words
        run: python -u make_assets.py

      - name: Show result
        run: |
          ls -lh assets.zip
          head -5 verify_report.csv

      - name: Upload assets.zip (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            assets.zip
            verify_report.csv
          retention-days: 30

      - name: Publish assets.zip as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="assets-${{ github.run_number }}"
          gh release create "$TAG" assets.zip verify_report.csv \
            --title "Assets build ${{ github.run_number }}" \
            --notes "Generated by workflow run ${{ github.run_id }}"
